<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Find Your Dream Internship</title>
  <meta name="description" content="Explore glassmorphism internship opportunities crafted for the next generation of builders.">
  <meta name="color-scheme" content="light dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>

    let savedTheme = 'light';
    try {
      savedTheme = localStorage.getItem('theme') || 'light';
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>

    <link rel="stylesheet" href="styles/index.css">
</head>
<body>

  <div class="background-container" aria-hidden="true">

    <video id="bg-video-dark" class="bg-video bg-video-dark" src="assets/videos/bg-dark.mp4" playsinline autoplay muted loop preload="auto"></video>
    <video id="bg-video-light" class="bg-video bg-video-light" src="assets/videos/bg-light.mp4" playsinline autoplay muted loop preload="auto"></video>

    <div class="orb-scroll-wrapper" id="scroll-blue">
      <div class="orb orb-blue"></div>
    </div>

    <div class="orb-scroll-wrapper" id="scroll-orange">
      <div class="orb orb-orange"></div>
    </div>

    <div class="orb-scroll-wrapper" id="scroll-ring-1">
      <div class="orb orb-ring-1">
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <defs>
            <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#BF953F" />
              <stop offset="25%" stop-color="#FCF6BA" />
              <stop offset="50%" stop-color="#B38728" />
              <stop offset="75%" stop-color="#FBF5B7" />
              <stop offset="100%" stop-color="#AA771C" />
            </linearGradient>
            <filter id="ring-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
            </filter>
          </defs>
          <ellipse cx="100" cy="100" rx="82" ry="24" stroke="url(#gold-gradient)" stroke-width="8" fill="none" filter="url(#ring-glow)" />
        </svg>
      </div>
    </div>

    <div class="orb-scroll-wrapper" id="scroll-ring-2">
      <div class="orb orb-ring-2">
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <ellipse cx="100" cy="100" rx="64" ry="17" stroke="url(#gold-gradient)" stroke-width="5.5" fill="none" filter="url(#ring-glow)" />
        </svg>
      </div>
    </div>
  </div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-orb"></span>
        AURA
      </a>
      <ul class="nav-links">
        <li><a href="#hero" class="active">Home</a></li>
        <li><a href="internships.html">Open Internships</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle dark/light theme">
          <div class="theme-toggle-circle">

            <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>

            <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </div>
          <span class="theme-text" id="theme-text-label">Dark Mode</span>
        </button>
      </div>
    </div>
  </nav>

  <section class="hero-section" id="hero">
    <div class="hero-content">

      <h1 class="hero-title" id="hero-title">Find Your Dream Internship</h1>

      <p class="hero-subtitle">
        Explore opportunities crafted for the next generation of builders
      </p>

      <div class="hero-ctas">
        <a href="internships.html" class="cta-solid">Explore Internships</a>
        <a href="internships.html" class="cta-glass">Learn More</a>
      </div>
    </div>

  </section>

  <footer class="site-footer">
    <div class="footer-container">
      <p>© 2026 AURA Internship Portal. Crafted for the next generation of builders.</p>
    </div>
  </footer>

  <div class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <a href="#hero" class="mobile-nav-item active" id="mobile-nav-home">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>
    <a href="internships.html" class="mobile-nav-item" id="mobile-nav-jobs">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
      </svg>
      <span>Internships</span>
    </a>
    <button class="mobile-nav-item" id="mobile-theme-toggle" aria-label="Toggle Theme">

      <svg class="sun-icon-mob" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>

      <svg class="moon-icon-mob hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span>Theme</span>
    </button>
  </div>

    <script defer src="scripts/index.js"></script>
</body>
</html>
